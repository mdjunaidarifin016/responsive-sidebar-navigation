<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slidebar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="main_box">
        <input type="checkbox" id="check">
        <div class="btn_one">
            <label for="check">
                <i class="fa-solid fa-bars"></i>
            </label>
        </div>

        <div class="slidebar_menu">
            <div class="logo">
                <a href="#">JunaidConding</a>
            </div>
            <div class="btn_two">
                <label for="check">
                    <i class="fa-solid fa-xmark"></i>
                </label>
            </div>
            <div class="menu">
                <ul>
                    <li><a href="#"><i class="fa-solid fa-qrcode"></i>
                            Dashboard</a></li>
                    <li><a href="#"><i class="fa-solid fa-link"></i>
                            Shortcuts</a></li>
                    <li><a href="#"><i class="fa-solid fa-stream"></i>
                            Overview</a></li>
                    <li><a href="#"><i class="fa-solid fa-calendar"></i>
                            Events</a></li>
                    <li><a href="#"><i class="fa-solid fa-circle-question"></i>
                            About</a></li>
                    <li><a href="#"><i class="fa-solid fa-sliders"></i>
                            Services</a></li>
                    <li><a href="#"><i class="fa-solid fa-address-book"></i>
                            Contact</a></li>
                    <li><a href="#"><i class="fa-solid fa-comment-dots"></i>
                            Feedback</a></li>
                </ul>
            </div>

            <div class="social_media">
                <a href="#"><i class="fa-brands fa-square-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>
    </div>


</body>

</html>
